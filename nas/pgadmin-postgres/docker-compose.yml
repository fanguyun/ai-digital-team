name: pgstack

# 绿联 UGOS 实测约束：
#   - 宿主机 127.0.0.1:5432 有 UGOS 自带 PostgreSQL；Docker 绑 0.0.0.0:5432 会静默失败
#   - 5050/5051 被迅雷 xunlei-pan-cli 占用 → pgAdmin 用 5080
#   - 80 被系统 nginx 占用 → 不能用 host 网络
#   - 局域网地址是 bridge0 192.168.31.150（192.100.x.x 是 libvirt 虚拟网桥）
#   - PG18 镜像布局：PGDATA=/var/lib/postgresql/18/docker，挂载点必须是 /var/lib/postgresql

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      # 只挂 /var/lib/postgresql，18 会在下面自建 18/docker
      # 挂成 .../data 会让数据落在容器可写层（重建即丢），并触发 "unused mount/volume" 报错
      - ./postgres/data:/var/lib/postgresql
    # 默认不发布端口：pgAdmin 走容器网络，本地同步脚本走 docker exec，都不需要它。
    # 若要用 Mac 上的 DBeaver/Navicat 直连，取消下面两行（只绑内网 IP，别绑 0.0.0.0）：
    # ports:
    #   - "192.168.31.150:15432:5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin-init:
    image: dpage/pgadmin4:9.19
    container_name: pgadmin-init
    restart: "no"
    user: "0:0"
    network_mode: "none"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/lib/pgadmin/sessions /var/lib/pgadmin/storage
        chown -R 5050:5050 /var/lib/pgadmin
        chmod -R u+rwX /var/lib/pgadmin
        echo "pgadmin data dir ready:"
        ls -ln /var/lib/pgadmin
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_DISABLE_POSTFIX: "True"
      TZ: ${TZ}
    ports:
      - "5080:80"            # 5050 被迅雷占用，不要改回
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin   # 必须宿主目录，不要命名卷
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
      pgadmin-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  database:
    driver: bridge
