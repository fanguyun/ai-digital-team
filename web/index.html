<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    try {
      var savedTheme = localStorage.getItem('pdt-theme')
      if (savedTheme === 'dark' || savedTheme === 'light') {
        document.documentElement.dataset.theme = savedTheme
      }
    } catch (error) {}
  </script>
</head>

<body>
  <div id="app-boot" role="status" aria-live="polite">
    <span class="app-boot-mark" aria-hidden="true"></span>
    <strong>个人数字团队</strong>
    <span>正在进入</span>
  </div>
  <!-- Please keep this div empty -->
  <div id="cedar-app"></div>
  <style>
    #app-boot {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 10px;
      background: #fafaf8;
      color: #20201e;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html[data-theme="dark"] #app-boot {
      background: #10100e;
      color: #f4f4f0;
    }
    #app-boot strong { font-size: 16px; font-weight: 600; }
    #app-boot span:last-child { color: #8f8f89; font-size: 13px; }
    .app-boot-mark {
      width: 28px;
      height: 28px;
      border: 2px solid #deded9;
      border-top-color: #1f8f72;
      border-radius: 50%;
      animation: app-boot-spin 0.8s linear infinite;
    }
    html[data-theme="dark"] .app-boot-mark { border-color: #343431; border-top-color: #3dbe98; }
    @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .app-boot-mark { animation: none; }
    }
  </style>
</body>

</html>
