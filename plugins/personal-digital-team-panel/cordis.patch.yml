# Bundle patch layer for personal-digital-team-panel.
#
# One row serves both halves: the package main entry (`lib/index.js`) mounts the
# host route that reads the team manifest, and the `dsh.client` declaration in
# package.json tells the web app to load `lib/client.js` into the browser.
# The route reads `<teamRoot>/agents/manifest.json`; without a reachable
# manifest it falls back to the bundled snapshot in `lib/data/team.json`.
- insert:
    - id: personal-digital-team-panel
      name: personal-digital-team-panel
